services:
  aula-nova:
    build:
      context: ./semana9/aula-nova
    ports:
      - "${AULA_NOVA_PORT:-3000}:3000"
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  tienda-demo:
    build:
      context: ./semana8/tienda-demo
    ports:
      - "${TIENDA_DEMO_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  selenium:
    image: selenium/standalone-chrome:4.51.0-20261010
    profiles: ["tests"]
    shm_size: 2gb
    ports:
      - "${SELENIUM_PORT:-4444}:4444"
      - "${SELENIUM_VNC_PORT:-7900}:7900"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bin/check-grid.sh --host 127.0.0.1 --port 4444"]
      interval: 5s
      timeout: 10s
      retries: 12

  selenium-tiendademo:
    build:
      context: ./semana8/tienda-demo
      dockerfile: Dockerfile.selenium-tests
    profiles: ["tests"]
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      TIENDA_DEMO_URL: http://tienda-demo
    depends_on:
      tienda-demo:
        condition: service_healthy
      selenium:
        condition: service_healthy

  playwright-tiendademo:
    build:
      context: ./semana8/tienda-demo
      dockerfile: Dockerfile.playwright-tests
    profiles: ["tests"]
    shm_size: 1gb
    environment:
      TIENDA_DEMO_URL: http://tienda-demo
    depends_on:
      tienda-demo:
        condition: service_healthy

  funcional-aula-nova:
    build:
      context: ./semana9/aula-nova
      dockerfile: Dockerfile.functional-tests
    profiles: ["tests"]
    environment:
      AULA_NOVA_URL: http://aula-nova:3000
      CI: "true"
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    depends_on:
      aula-nova:
        condition: service_healthy
      selenium:
        condition: service_healthy

  k6:
    build:
      context: ./semana9/aula-nova
      dockerfile: Dockerfile.k6
    profiles: ["tests"]
    working_dir: /scripts
    entrypoint: ["k6"]
    environment:
      BASE_URL: http://aula-nova:3000
    depends_on:
      aula-nova:
        condition: service_healthy
